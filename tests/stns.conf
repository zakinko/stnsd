# Test fixture.  Every entry here exists to make one difference visible, and
# the whole file is valid for upstream STNS as well, because tests/compat.sh
# serves it from both and compares the answers byte for byte.

port = 11104

[users.alice]
id = 1001
group_id = 1001
directory = "/home/alice"
shell = "/bin/sh"
# < > & are escaped by Go's encoder even though JSON does not require it.
gecos = "Alice <alice@example.com> & co"
keys = ["ssh-ed25519 AAAAKEYA alice"]

# Nothing but an id and a group: every string comes back empty and keys null.
[users.bob]
id = 1002
group_id = 1001

# An empty list is [] on the wire, where an absent one is null.
[users.carol]
id = 1003
group_id = 1002
password = "$6$salt$0123456789abcdef"
keys = []
# dave links alice, so carol gets alice's key through dave as well as directly.
link_users = ["alice", "dave"]

[users.dave]
id = 1004
group_id = 1002
keys = ["ssh-rsa AAAAKEYD2 dave", "ssh-rsa AAAAKEYD1 dave"]
link_users = ["alice"]

# A link naming nothing: the merge contributes nothing and the list stays null
# rather than becoming [].
[users.eve]
id = 1005
group_id = 1002
link_users = ["nosuchuser"]

[groups.staff]
id = 1001
users = ["alice", "bob"]

[groups.ops]
id = 1002
users = ["carol"]
link_groups = ["staff"]

[groups.empty]
id = 1003

[groups.emptylist]
id = 1004
users = []
