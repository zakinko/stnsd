name: Packaging

# Builds the pkgsrc package and the FreeBSD port for real, from the release
# tarball on github, rather than only checking the packing lists against a
# staged install the way the main CI does.  It needs a whole package
# collection in each VM, so it runs on its own schedule: when the packaging
# files change, and on request.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Makefile'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'Makefile'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

env:
  # The packaging is not in this repository: it lives in the overlays, beside
  # the packaging for everything else.  Pin these to a tag when cutting a
  # release; main is what says whether the packaging still works today.
  #
  #   https://github.com/zakinko/pkgsrc-zakinko
  #   https://github.com/zakinko/ports-zakinko
  PKGSRC_OVERLAY_REF: main
  PORTS_OVERLAY_REF: main

# There used to be a job here checking that the packaging published beside the
# release -- stnsd-<version>-packaging.tar.gz -- still matched the copy in this
# tree.  Both copies are gone: the packaging has one home now, the overlay, and
# an installer clones that instead of downloading a release asset.  What the
# job was really protecting is still covered, because the builds below fetch
# the release tarball from github and check it against the overlay's distinfo.
jobs:
  pkgsrc:
    name: pkgsrc (NetBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zakinko/pkgsrc-zakinko
          ref: ${{ env.PKGSRC_OVERLAY_REF }}
          path: overlay-pkgsrc
      - name: Build and install the package
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add curl digest
          run: |
            set -e
            WORK=$(pwd)

            echo "== fetching pkgsrc =="
            ftp -o /tmp/pkgsrc.tar.gz \
              https://cdn.NetBSD.org/pub/pkgsrc/current/pkgsrc.tar.gz
            tar -C /usr -xzf /tmp/pkgsrc.tar.gz
            rm -f /tmp/pkgsrc.tar.gz

            # pkglint is pkgsrc's own correctness check: Makefile ordering and
            # style, PLIST, DESCR length, category, licence spelling.  It is
            # the part of a pkgsrc review that can be automated.
            /usr/sbin/pkg_add pkglint || true

            echo "== dropping the package in =="
            # The whole category goes in, not just this package: pkglint
            # checks that a package is listed in its category Makefile, and
            # that its first category is the directory it sits in.
            mkdir -p /usr/pkgsrc/zakinko
            (cd "$WORK"/overlay-pkgsrc && tar --exclude .git -cf - .) |
              (cd /usr/pkgsrc/zakinko && tar -xf -)
            cd /usr/pkgsrc/zakinko/stnsd
            pkglint .

            echo "== build, package, install =="
            # The distfile is fetched from github and checked against the
            # distinfo in the tree, so this also says whether the checksums
            # we shipped are the ones the release actually has.
            make DEPENDS_TARGET=bin-install package
            make install

            echo "== what landed =="
            pkg_info -L stnsd
            /usr/pkg/sbin/stnsd -V
            test -f /usr/pkg/share/examples/rc.d/stnsd
            # The directory has to be made before a configuration file can be
            # created in it, and neither happens unless the package asks.
            ls -ld /usr/pkg/etc/stns /usr/pkg/etc/stns/server
            test -d /usr/pkg/etc/stns/server
            test -f /usr/pkg/etc/stns/server/stns.conf
            # CONF_FILES_PERMS put it there root owned and unreadable to
            # anyone else, because it is where the password hashes go.
            ls -l /usr/pkg/etc/stns/server/stns.conf
            ls -l /usr/pkg/etc/stns/server/stns.conf | grep -q '^-rw-------'

            echo "== it has to actually run =="
            cp "$WORK"/tests/stns.conf /usr/pkg/etc/stns/server/stns.conf
            # The package registers the script but only copies it into
            # /etc/rc.d when PKG_RCD_SCRIPTS=YES, which is not the default,
            # so do what an administrator does.
            cp /usr/pkg/share/examples/rc.d/stnsd /etc/rc.d/stnsd
            echo stnsd=YES >> /etc/rc.conf
            /etc/rc.d/stnsd configtest
            /etc/rc.d/stnsd start
            i=0
            while [ $i -lt 50 ]; do
              curl -sf -o /dev/null http://127.0.0.1:11104/v1/status && break
              i=$((i + 1))
              sleep 0.2
            done
            curl -s 'http://127.0.0.1:11104/v1/users?name=alice'
            /etc/rc.d/stnsd stop

            echo "== and a broken configuration must stop it starting =="
            echo 'this is not valid toml = = =' > /usr/pkg/etc/stns/server/stns.conf
            if /etc/rc.d/stnsd start; then
              echo "FAIL - started with a broken configuration" >&2
              exit 1
            fi

            echo "== deinstall =="
            cd /usr/pkgsrc/zakinko/stnsd
            make deinstall
            test ! -f /usr/pkg/sbin/stnsd

  ports:
    name: ports (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zakinko/ports-zakinko
          ref: ${{ env.PORTS_OVERLAY_REF }}
          path: overlay-ports
      - name: Build and install the port
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git curl
          run: |
            set -e
            WORK=$(pwd)

            echo "== fetching the ports tree =="
            git clone --depth 1 --single-branch \
              https://git.FreeBSD.org/ports.git /usr/ports

            echo "== dropping the category in =="
            # zakinko is not one of the categories bsd.port.mk knows, and
            # check-sanity rejects a CATEGORIES entry it cannot find in that
            # list.  Adding it is what an administrator does to use the overlay.
            echo 'VALID_CATEGORIES+=zakinko' >> /etc/make.conf
            mkdir -p /usr/ports/zakinko
            (cd "$WORK"/overlay-ports && tar --exclude .git -cf - .) |
              (cd /usr/ports/zakinko && tar -xf -)
            cd /usr/ports/zakinko/stnsd

            echo "== stage and check the packing list =="
            make stage
            make check-plist
            echo "== package and install =="
            make package
            make install

            echo "== what landed =="
            pkg info -l stnsd
            /usr/local/sbin/stnsd -V
            test -f /usr/local/etc/rc.d/stnsd

            echo "== it has to actually run =="
            cp "$WORK"/tests/stns.conf /usr/local/etc/stns/server/stns.conf
            service stnsd onestart
            i=0
            while [ $i -lt 50 ]; do
              curl -sf -o /dev/null http://127.0.0.1:11104/v1/status && break
              i=$((i + 1))
              sleep 0.2
            done
            curl -s 'http://127.0.0.1:11104/v1/users?name=alice'
            service stnsd onestop

            echo "== deinstall =="
            make deinstall
            test ! -f /usr/local/sbin/stnsd
