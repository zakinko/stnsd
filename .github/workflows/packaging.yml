name: Packaging

# Builds the pkgsrc package and the FreeBSD port for real, from the release
# tarball on github, rather than only checking the packing lists against a
# staged install the way the main CI does.  It needs a whole package
# collection in each VM, so it runs on its own schedule: when the packaging
# files change, and on request.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pkg/**'
      - 'Makefile'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'pkg/**'
      - 'Makefile'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

jobs:
  # The packaging cannot live inside the release tarball: each distinfo
  # records that tarball's checksum, which is only knowable once it exists.
  # So it is published beside it -- and this is what keeps the published copy
  # and the tree from drifting apart, which is exactly how an install of the
  # documented path came to fail while every other job here was green.
  published:
    name: published packaging matches the tree
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          V=$(sed -n 's/^DISTNAME=[[:space:]]*stnsd-//p' pkg/pkgsrc/security/stnsd/Makefile)
          echo "packaging in the tree is for stnsd-$V"
          url=https://github.com/zakinko/stnsd/releases/download/v$V/stnsd-$V-packaging.tar.gz
          if ! curl -sfL -o /tmp/pkg.tar.gz "$url"; then
            echo "FAIL - no packaging published for v$V." >&2
            echo "       Build it from pkg/ and attach it:" >&2
            echo "       gh release upload v$V stnsd-$V-packaging.tar.gz" >&2
            exit 1
          fi
          mkdir -p /tmp/pub && tar -C /tmp/pub -xzf /tmp/pkg.tar.gz
          diff -ru /tmp/pub/pkgsrc pkg/pkgsrc
          diff -ru /tmp/pub/ports pkg/ports
          echo "ok - what is published is what is in the tree"

  pkgsrc:
    name: pkgsrc (NetBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the package
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add curl digest
          run: |
            set -e
            WORK=$(pwd)

            echo "== fetching pkgsrc =="
            ftp -o /tmp/pkgsrc.tar.gz \
              https://cdn.NetBSD.org/pub/pkgsrc/current/pkgsrc.tar.gz
            tar -C /usr -xzf /tmp/pkgsrc.tar.gz
            rm -f /tmp/pkgsrc.tar.gz

            # pkglint is pkgsrc's own correctness check: Makefile ordering and
            # style, PLIST, DESCR length, category, licence spelling.  It is
            # the part of a pkgsrc review that can be automated.
            /usr/sbin/pkg_add pkglint || true

            echo "== dropping the package in =="
            mkdir -p /usr/pkgsrc/security/stnsd
            cp -R "$WORK"/pkg/pkgsrc/security/stnsd/. /usr/pkgsrc/security/stnsd/
            cd /usr/pkgsrc/security/stnsd
            pkglint .

            echo "== build, package, install =="
            # The distfile is fetched from github and checked against the
            # distinfo in the tree, so this also says whether the checksums
            # we shipped are the ones the release actually has.
            make DEPENDS_TARGET=bin-install package
            make install

            echo "== what landed =="
            pkg_info -L stnsd
            /usr/pkg/sbin/stnsd -V
            test -f /usr/pkg/share/examples/rc.d/stnsd
            test -f /usr/pkg/etc/stns/server/stns.conf
            # CONF_FILES_PERMS put it there root owned and unreadable to
            # anyone else, because it is where the password hashes go.
            ls -l /usr/pkg/etc/stns/server/stns.conf | grep -q '^-rw-------'

            echo "== it has to actually run =="
            cp "$WORK"/tests/stns.conf /usr/pkg/etc/stns/server/stns.conf
            # The package registers the script but only copies it into
            # /etc/rc.d when PKG_RCD_SCRIPTS=YES, which is not the default,
            # so do what an administrator does.
            cp /usr/pkg/share/examples/rc.d/stnsd /etc/rc.d/stnsd
            echo stnsd=YES >> /etc/rc.conf
            /etc/rc.d/stnsd configtest
            /etc/rc.d/stnsd start
            i=0
            while [ $i -lt 50 ]; do
              curl -sf -o /dev/null http://127.0.0.1:11104/v1/status && break
              i=$((i + 1))
              sleep 0.2
            done
            curl -s 'http://127.0.0.1:11104/v1/users?name=alice'
            /etc/rc.d/stnsd stop

            echo "== and a broken configuration must stop it starting =="
            echo 'this is not valid toml = = =' > /usr/pkg/etc/stns/server/stns.conf
            if /etc/rc.d/stnsd start; then
              echo "FAIL - started with a broken configuration" >&2
              exit 1
            fi

            echo "== deinstall =="
            cd /usr/pkgsrc/security/stnsd
            make deinstall
            test ! -f /usr/pkg/sbin/stnsd

  ports:
    name: ports (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the port
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git curl
          run: |
            set -e
            WORK=$(pwd)

            echo "== fetching the ports tree =="
            git clone --depth 1 --single-branch \
              https://git.FreeBSD.org/ports.git /usr/ports

            echo "== dropping the port in =="
            mkdir -p /usr/ports/security/stnsd
            cp -R "$WORK"/pkg/ports/security/stnsd/. /usr/ports/security/stnsd/
            cd /usr/ports/security/stnsd

            echo "== stage and check the packing list =="
            make stage
            make check-plist
            echo "== package and install =="
            make package
            make install

            echo "== what landed =="
            pkg info -l stnsd
            /usr/local/sbin/stnsd -V
            test -f /usr/local/etc/rc.d/stnsd

            echo "== it has to actually run =="
            cp "$WORK"/tests/stns.conf /usr/local/etc/stns/server/stns.conf
            service stnsd onestart
            i=0
            while [ $i -lt 50 ]; do
              curl -sf -o /dev/null http://127.0.0.1:11104/v1/status && break
              i=$((i + 1))
              sleep 0.2
            done
            curl -s 'http://127.0.0.1:11104/v1/users?name=alice'
            service stnsd onestop

            echo "== deinstall =="
            make deinstall
            test ! -f /usr/local/sbin/stnsd
